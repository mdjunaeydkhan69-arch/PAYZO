<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>PAYZO</title><style>body{margin:0;background:#0b1020;color:#f8fafc;font-family:system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 16px}.brand{text-align:center;color:#e8bd62;font-weight:900;font-size:30px;letter-spacing:2px}.box{background:#121a2e;border:1px solid #29344c;border-radius:18px;padding:22px;margin-top:20px}input{box-sizing:border-box;width:100%;padding:12px;margin:8px 0 14px;background:#0b1020;color:white;border:1px solid #35425c;border-radius:10px}button{padding:13px;width:100%;border:0;border-radius:10px;background:#e8bd62;font-weight:800}.msg{font-size:14px;line-height:1.5;color:#ffbcbc}.muted{color:#aab3c8;font-size:13px}</style></head><body><main class="wrap"><div class="brand">PAYZO</div><section class="box"><h2>Account Sign In</h2><p class="muted">Sign in with your authorized account.</p><div id="message" class="msg"></div><form id="adminForm"><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" minlength="6" required></label><button id="submit" type="submit">Continue</button></form></section><section id="adminArea" class="box" hidden><h2>Overview</h2><p id="adminIdentity" class="muted"></p><p>Withdraw requests</p><div id="withdrawals"></div><button id="logout">Logout</button></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
